<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaPilot Crypto 监控驾驶舱</title>
<style>
:root{
  --bg:#f2f5f9; --card:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
  --up:#16a34a; --down:#dc2626; --accent:#2563eb; --warn:#d97706;
  --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5;padding:16px}
.wrap{max-width:1200px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:18px}
header h1{font-size:20px;font-weight:700;letter-spacing:.3px}
header h1 .dot{color:var(--up)}
header .meta{margin-left:auto;color:var(--sub);font-size:12px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;margin-left:8px}
.badge.on{background:#dcfce7;color:var(--up)}
.badge.off{background:#fee2e2;color:var(--down)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.card .label{color:var(--sub);font-size:12px;margin-bottom:6px}
.card .value{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.card .value.sm{font-size:18px}
.card .sub{color:var(--sub);font-size:12px;margin-top:4px}
.up{color:var(--up)} .down{color:var(--down)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.grid.cols2{grid-template-columns:1fr 1fr}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.panel h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 .tag{font-size:11px;color:var(--sub);font-weight:400}
canvas{width:100%;height:280px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--sub);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#f8fafc}
.tbl{max-height:420px;overflow:auto}
.flag{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.flag b{color:var(--warn)}
.note{color:var(--sub);font-size:12px;margin-bottom:6px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.bar-row .name{width:110px;flex-shrink:0;color:var(--sub)}
.bar-track{flex:1;height:16px;background:#f1f5f9;border-radius:8px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:8px}
.bar-val{width:90px;text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv .k{color:var(--sub);font-size:12px}
.kv .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
@media(max-width:820px){
  .grid,.grid.cols2{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(2,1fr)}
  header .meta{margin-left:0;width:100%}
  .card .value{font-size:20px}
  .bar-row .name{width:80px}
  .bar-val{width:70px}
}
@media(max-width:480px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .card .value{font-size:18px}
  th,td{font-size:12px;padding:6px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><span class="dot">●</span> AlphaPilot Crypto 监控驾驶舱</h1>
  <span id="serviceBadge" class="badge">…</span>
  <div class="meta"><span id="asof"></span> · <span id="countdown"></span></div>
</header>

<section class="cards" id="cards"></section>

<div class="grid">
  <div class="panel"><h3>资金曲线 <span class="tag" id="eqRange"></span></h3><canvas id="eqChart"></canvas></div>
  <div class="panel">
    <h3>分币种盈亏</h3>
    <div id="bySymbol"></div>
    <h3 style="margin-top:16px">平仓原因</h3>
    <div id="byExit"></div>
  </div>
</div>

<div class="grid cols2">
  <div class="panel">
    <h3>当前持仓 <span class="tag" id="posCount"></span></h3>
    <div class="tbl"><table id="posTable">
      <thead><tr><th>币种</th><th>方向</th><th class="num">入场价</th><th class="num">仓位</th><th class="num">浮盈亏</th><th class="num">浮盈%</th><th class="num">持仓h</th><th class="num">信号</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>
  <div class="panel">
    <h3>最近成交 <span class="tag" id="tradeCount"></span></h3>
    <div class="tbl"><table id="tradeTable">
      <thead><tr><th>时间</th><th>币种</th><th>方向</th><th>原因</th><th class="num">盈亏%</th><th class="num">盈亏USDT</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>
</div>

<div class="grid cols2">
  <div class="panel">
    <h3>自我学习系统</h3>
    <div id="learning"></div>
  </div>
  <div class="panel">
    <h3>模型 & 护栏</h3>
    <div class="kv" id="model"></div>
    <div id="guardHist" style="margin-top:12px"></div>
  </div>
</div>

<footer style="color:var(--sub);font-size:12px;text-align:center;margin:24px 0 8px">
  AlphaPilot Crypto Self-Improving Quant · 数据每 30 秒自动刷新
</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = (v, d=2) => Number(v||0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const pnlCls = v => v>0?"up":(v<0?"down":"");
const pnlStr = v => (v>0?"+":"")+fmt(v);
let timer = null;

function serviceBadge(ok){
  const el = $("serviceBadge");
  el.textContent = ok ? "仿真运行中" : "状态未知";
  el.className = "badge " + (ok ? "on" : "off");
}

function renderCards(s){
  const c = s.state, st = s.stats;
  const ret = (s.state.equity/s.state.initial_capital-1)*100;
  const cards = [
    {label:"当前权益", value:"$"+fmt(c.equity), sub:"本金 $"+fmt(c.initial_capital,0)},
    {label:"累计收益", value:pnlStr(st.total_pnl)+" USDT", sub:"收益率 "+pnlStr(ret)+"%", cls:pnlCls(ret)},
    {label:"今日盈亏", value:pnlStr(st.today.pnl)+" USDT", sub:st.today.n+" 笔平仓", cls:pnlCls(st.today.pnl)},
    {label:"昨日盈亏", value:pnlStr(st.yesterday.pnl)+" USDT", sub:st.yesterday.n+" 笔平仓", cls:pnlCls(st.yesterday.pnl)},
    {label:"胜率", value:fmt(st.win_rate,1)+"%", sub:st.n_wins+"胜 / "+st.n_losses+"负"},
    {label:"最大回撤", value:fmt(st.max_drawdown_pct,2)+"%", cls:st.max_drawdown_pct<0?"down":""},
    {label:"当前持仓", value:c.open_positions, sub:"已平 "+c.closed_trades+" 笔"},
    {label:"累计手续费", value:"$"+fmt(st.total_fees,2), sub:"止盈/止损自动管理"},
  ];
  $("cards").innerHTML = cards.map(x=>
    `<div class="card"><div class="label">${x.label}</div><div class="value ${x.cls||""}">${x.value}</div><div class="sub">${x.sub||""}</div></div>`
  ).join("");
}

function drawEquity(s){
  const cv = $("eqChart"), ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio||1;
  const W = cv.clientWidth, H = 280;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const pts = s.equity_curve||[];
  if(pts.length<2){ ctx.fillStyle="#64748b"; ctx.font="14px sans-serif"; ctx.fillText("暂无资金数据",W/2-40,H/2); return; }
  const padL=12,padR=12,padT=14,padB=24;
  let min=Infinity,max=-Infinity;
  pts.forEach(p=>{min=Math.min(min,p.equity);max=Math.max(max,p.equity)});
  const span=(max-min)||1;
  const X=i=>padL+(W-padL-padR)*i/(pts.length-1);
  const Y=v=>padT+(H-padT-padB)*(1-(v-min)/span);
  // grid lines
  ctx.strokeStyle="#e2e8f0"; ctx.fillStyle="#94a3b8"; ctx.font="11px sans-serif";
  for(let g=0;g<=4;g++){
    const v=min+span*g/4, y=Y(v);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    ctx.fillText(fmt(v,0),W-padR-56,y-3);
  }
  // area + line
  ctx.beginPath();ctx.moveTo(X(0),Y(pts[0].equity));
  pts.forEach((p,i)=>ctx.lineTo(X(i),Y(p.equity)));
  ctx.lineTo(X(pts.length-1),Y(pts[pts.length-1].equity));
  ctx.strokeStyle="#2563eb";ctx.lineWidth=2;ctx.stroke();
  ctx.lineTo(X(pts.length-1),H-padB);ctx.lineTo(X(0),H-padB);ctx.closePath();
  ctx.fillStyle="rgba(37,99,235,.10)";ctx.fill();
  // first/last labels
  ctx.fillStyle="#64748b";
  ctx.fillText(pts[0].ts.slice(0,16),padL,H-8);
  ctx.fillText(pts[pts.length-1].ts.slice(0,16),W-padR-92,H-8);
}

function bars(div, data, labelFn, maxPnl){
  if(!data || !Object.keys(data).length){ div.innerHTML='<div class="note">暂无数据</div>'; return; }
  const mx = maxPnl || Math.max(...Object.values(data).map(v=>Math.abs(v.pnl||0)),1);
  div.innerHTML = Object.entries(data).map(([k,v])=>{
    const p=v.pnl||0;
    const w=Math.max(2,Math.abs(p)/mx*100);
    const color=p>=0?"var(--up)":"var(--down)";
    const bar=`<div class="bar-fill" style="width:${w}%;background:${color}"></div>`;
    const left = p>=0 ? `style="margin-left:50%"` : `style="margin-left:${50-w}%"`;
    return `<div class="bar-row"><span class="name">${labelFn(k)}</span>
      <div class="bar-track"><div class="bar-fill" ${left} style="width:${w}%;background:${color}"></div></div>
      <span class="bar-val ${pnlCls(p)}">${pnlStr(p)}</span>
      <span class="bar-val" style="width:60px;color:var(--sub)">${v.win_rate||0}%</span></div>`;
  }).join("");
}

function renderTables(s){
  const pos=s.open_positions||[], tr=s.recent_trades||[];
  $("posCount").textContent = pos.length+" 个";
  $("tradeCount").textContent = tr.length+" 笔";
  $("posTable").querySelector("tbody").innerHTML = pos.map(p=>`
    <tr><td>${p.symbol}</td><td style="color:${p.direction==="long"?"var(--up)":"var(--down)"}">${p.direction==="long"?"做多":"做空"}</td>
    <td class="num">${fmt(p.entry_price,4)}</td><td class="num">$${fmt(p.size,1)}</td>
    <td class="num ${pnlCls(p.upnl)}">${pnlStr(p.upnl)}</td><td class="num ${pnlCls(p.upnl_pct)}">${pnlStr(p.upnl_pct)}%</td>
    <td class="num">${fmt(p.hold_h,1)}</td><td class="num">${p.entry_score?fmt(p.entry_score,2):"—"}</td></tr>`
  ).join("");
  const reasonTxt={take_profit:"止盈",stop_loss:"止损",max_hold:"超时"};
  $("tradeTable").querySelector("tbody").innerHTML = tr.map(t=>`
    <tr><td>${t.exit_time}</td><td>${t.symbol}</td>
    <td style="color:${t.direction==="long"?"var(--up)":"var(--down)"}">${t.direction==="long"?"多":"空"}</td>
    <td>${reasonTxt[t.exit_reason]||t.exit_reason}</td>
    <td class="num ${pnlCls(t.pnl_pct)}">${pnlStr(t.pnl_pct)}%</td>
    <td class="num ${pnlCls(t.pnl)}">${pnlStr(t.pnl)}</td></tr>`
  ).join("");
}

function renderLearning(s){
  const l=s.learning, a=s.adaptive||{};
  let html="";
  if(l.flags&&l.flags.length){
    html += '<div class="note">⚠ 自动识别到持续亏损组合：</div>';
    html += l.flags.map(f=>`<div class="flag"><b>${f.bucket||f.type}</b> — ${f.suggestion||""} (n=${f.n}, pnl=${pnlStr(f.pnl)}, 胜率 ${f.win_rate}%)</div>`).join("");
  } else {
    html += '<div class="note">✓ 暂无持续亏损告警</div>';
  }
  if(l.notes&&l.notes.length){
    html += '<div class="note" style="margin-top:10px">最近调整：</div>';
    html += l.notes.map(n=>`<div class="note mono">· ${n}</div>`).join("");
  }
  const ps=a.per_symbol;
  if(ps&&Object.keys(ps).length){
    html += '<div class="note" style="margin-top:10px">自适应门槛：</div>';
    html += Object.entries(ps).map(([k,v])=>`<div class="note mono">· ${k} → 多${v.long??"—"} / 空${v.short??"—"}</div>`).join("");
  }
  const sg=a.session_gates;
  if(sg&&Object.keys(sg).length){
    html += '<div class="note" style="margin-top:6px;color:var(--warn)">⚠ 已禁用时段：'+Object.keys(sg).join(", ")+'</div>';
  }
  $("learning").innerHTML = html;
}

function renderModel(s){
  const m=s.model, g=s.guardrail||{};
  const rows=[
    {k:"Long AUC", v:m.long_auc?fmt(m.long_auc,4):"—"},
    {k:"Short AUC", v:m.short_auc?fmt(m.short_auc,4):"—"},
    {k:"因子数", v:m.n_factors??"—"},
    {k:"WFO Long (OOS)", v:g.long_oos_auc?fmt(g.long_oos_auc,4):"—"},
    {k:"WFO Short (OOS)", v:g.short_oos_auc?fmt(g.short_oos_auc,4):"—"},
    {k:"护栏决策", v:g.long_decision==="accept"?"✓ 通过":"—"},
  ];
  $("model").innerHTML = rows.map(r=>`<div><div class="k">${r.k}</div><div class="v">${r.v}</div></div>`).join("");
  const gh=s.guardrail_history||[];
  if(gh.length){
    $("guardHist").innerHTML = '<div class="note">护栏历史（最近'+gh.length+'次）：</div>'+
      gh.slice().reverse().map(x=>`<div class="note mono">· ${x.date} ${x.target}: OOS=${fmt(x.oos_auc,4)} ${x.decision==="accept"?"✓接受":"✗拒绝"}</div>`).join("");
  }
}

function render(s){
  $("asof").textContent = "更新于 " + s.asof;
  serviceBadge(true);
  renderCards(s);
  drawEquity(s);
  bars($("bySymbol"), s.by_symbol, k=>k, s.stats.total_pnl);
  bars($("byExit"), s.by_exit_reason, k=>({take_profit:"止盈",stop_loss:"止损",max_hold:"超时"}[k]||k));
  renderTables(s);
  renderLearning(s);
  renderModel(s);
}

function refresh(){
  fetch("api/state",{cache:"no-store"}).then(r=>r.json()).then(s=>{
    render(s); startCountdown();
  }).catch(e=>{ serviceBadge(false); $("asof").textContent="连接服务器失败: "+e.message; });
}

function startCountdown(){
  let n=30; $("countdown").textContent=n+"s 后刷新";
  clearInterval(timer);
  timer=setInterval(()=>{ n--; if(n<=0){n=30;} $("countdown").textContent=n+"s 后刷新"; },1000);
}

refresh();
setInterval(refresh, 30000);
window.addEventListener("resize",()=>{ if(window.__s) drawEquity(window.__s); });
</script>
</body>
</html>
